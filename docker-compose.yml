services:

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"
      - "18083:18083"
    networks:
      - pfe-network
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=yassine
      - DOCKER_INFLUXDB_INIT_PASSWORD=pfe_password123
      - DOCKER_INFLUXDB_INIT_ORG=stage_pfe
      - DOCKER_INFLUXDB_INIT_BUCKET=esp32-sensor
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - pfe-network
    restart: unless-stopped

  zabbix:
    image: zabbix/zabbix-appliance:latest
    container_name: zabbix-appliance
    ports:
      - "8080:80"
      - "10051:10051"
    volumes:
      - zabbix-data:/var/lib/zabbix
    networks:
      - pfe-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - pfe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      echo 'Bucket mlflow-artifacts ready'
      "
    networks:
      - pfe-network
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow_persist/mlflow.db
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
    volumes:
      - ./mlops:/mlflow_persist
    depends_on:
      - minio-init
    networks:
      - pfe-network
    restart: unless-stopped

  ota-server:
    build: ./ota-server
    container_name: ota-server
    ports:
      - "8090:8090"
    volumes:
      - ./ota-server/firmware:/firmware
    networks:
      - pfe-network
    restart: unless-stopped

volumes:
  influxdb-data:
  zabbix-data:
  minio-data:

networks:
  pfe-network:
    driver: bridge
